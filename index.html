<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POATUBE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4ef0'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--s:#f2f2f4;--s2:#e6e6ea;--tx:#111118;--mu:#626270;--ac:#5b4ef0;--acx:#fff;--bd:#d9d9e0;--er:#c0262d;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151b;--s:#22222b;--s2:#2e2e39;--tx:#f1f1f5;--mu:#a2a2b2;--ac:#8c82ff;--acx:#14141c;--bd:#33333f;--er:#ff7b80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15151b;--s:#22222b;--s2:#2e2e39;--tx:#f1f1f5;--mu:#a2a2b2;--ac:#8c82ff;--acx:#14141c;--bd:#33333f;--er:#ff7b80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg);height:56px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.ib:hover{background:var(--s)}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:20px;letter-spacing:-.04em;cursor:pointer}
.logo b{display:grid;place-items:center;width:30px;height:22px;border-radius:7px;background:var(--ac);color:var(--acx);font-size:11px}
.search{flex:1;max-width:560px;margin:0 auto;display:flex}
.search input{flex:1;min-width:0;padding:8px 16px;border:1px solid var(--bd);border-radius:20px 0 0 20px;background:var(--bg)}
.search button{padding:0 18px;border:1px solid var(--bd);border-left:0;border-radius:0 20px 20px 0;background:var(--s)}
#u{display:flex;align-items:center;gap:8px}
.me,.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:hsl(var(--h,250) 55% 40%)}
.me{width:32px;height:32px}
.av.big{width:80px;height:80px;font-size:32px}
.wrap{display:flex}
nav{width:220px;flex:none;padding:8px 12px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px);overflow:auto}
nav.off{display:none}
nav button{display:flex;gap:18px;align-items:center;width:100%;padding:9px 12px;border-radius:10px;text-align:left}
nav button:hover{background:var(--s)}
nav button.on{background:var(--s);font-weight:700}
nav h4{margin:14px 12px 4px;color:var(--mu);font-size:13px;font-weight:600}
main{flex:1;min-width:0;padding:0 16px 48px}
.note{margin:8px 0 12px;padding:10px 14px;border-radius:10px;background:var(--s);color:var(--mu);font-size:14px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:8px 0 16px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));background:var(--bg);z-index:5}
.chips button{flex:none;padding:6px 14px;border-radius:8px;background:var(--s);white-space:nowrap}
.chips button.on{background:var(--tx);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px 16px}
.card{display:block;cursor:pointer}
.card:hover .th{border-radius:4px}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:40px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 48%),hsl(calc(var(--h) + 50) 70% 24%))}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th i{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-style:normal;font-size:12px;padding:1px 5px;border-radius:4px}
.meta{display:flex;gap:10px;margin-top:10px}
.meta h3,.rel h3{margin:0;font-size:15px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta p{margin:2px 0 0;color:var(--mu);font-size:13px}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding-top:8px}
.player{width:100%;aspect-ratio:16/9;border-radius:14px;background:#000;display:block}
h1{font-size:20px;line-height:1.3;margin:12px 0 8px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:140px}
.grow b{display:block}.grow small{color:var(--mu)}
.btn{display:inline-block;padding:8px 16px;border-radius:20px;background:var(--s);font-weight:600}
.btn:hover{background:var(--s2)}
.btn.pri{background:var(--tx);color:var(--bg)}
.btn.on{background:var(--ac);color:var(--acx)}
.btn:disabled{opacity:.6;cursor:wait}
.desc{margin:14px 0;padding:12px;border-radius:12px;background:var(--s);font-size:14px}
.pre{white-space:pre-wrap;margin-top:6px;overflow-wrap:anywhere}
.cm{display:flex;gap:12px;margin:14px 0}
.cm p{margin:2px 0 0;overflow-wrap:anywhere}
.cm small{color:var(--mu)}
.cm button{color:var(--mu);font-size:12px;margin-left:8px}
.cf{display:flex;gap:10px;margin:16px 0}
.cf input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--bd);background:none;padding:6px 0}
.rel{display:flex;gap:10px;margin-bottom:12px;cursor:pointer}
.rel .th{width:168px;flex:none;font-size:28px;border-radius:8px}
.rel p{margin:2px 0 0;font-size:12px;color:var(--mu)}
.empty{padding:60px 0;text-align:center;color:var(--mu)}
.empty .btn{margin-top:14px}
.box{max-width:520px;margin:24px auto;display:flex;flex-direction:column;gap:14px}
.box label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.box label.ck{flex-direction:row;gap:10px;font-weight:400;align-items:flex-start}
.box input:not([type=checkbox]),.box select,.box textarea{padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-weight:400}
.err{color:var(--er);margin:0;min-height:1em}
.ch{margin:16px 0 24px}
@media (max-width:1000px){.watch{grid-template-columns:1fr}}
@media (max-width:800px){nav{position:fixed;left:0;top:calc(56px + env(safe-area-inset-top,0px));background:var(--bg);z-index:25;box-shadow:4px 0 20px rgba(0,0,0,.25)}}
@media (max-width:640px){main{padding:0 12px 40px}.rel .th{width:140px}.search{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="ib" data-a="menu" aria-label="Menu">☰</button>
  <div class="logo" data-a="home" role="button" tabindex="0"><b>▶</b>POATUBE</div>
  <form class="search" id="sf" role="search"><input id="q" type="search" placeholder="Pesquisar" aria-label="Pesquisar"><button aria-label="Buscar">🔍</button></form>
  <div id="u"></div>
  <button class="ib" data-a="theme" aria-label="Alternar tema">◐</button>
</header>
<div class="wrap"><nav id="nav" aria-label="Principal"></nav><main id="main"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const C=window.POATUBE_CONFIG||{},CATS=["Música","Jogos","Tecnologia","Culinária","Viagens","Esportes","Ciência","Educação","Outros"],MAXMB=C.maxMB||50;
const $=s=>document.querySelector(s),main=$("#main"),nav=$("#nav");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fm=n=>n>=1e6?(n/1e6).toFixed(1).replace(".",",")+" mi":n>=1e3?Math.round(n/1e3)+" mil":String(n||0);
const dur=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0")};
const rtf=new Intl.RelativeTimeFormat("pt-BR",{numeric:"auto"});
const ago=t=>{const d=(new Date(t).getTime()-Date.now())/1e3;for(const[u,s]of[["year",31536e3],["month",2592e3],["day",86400],["hour",3600],["minute",60]])if(Math.abs(d)>=s)return rtf.format(Math.round(d/s),u);return"agora"};
const hue=s=>Math.abs([...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%360;
const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,"0")).join("");
let sb=null,ME=null,ADMIN=false,R=0,W=null;const S={nav:"home",cat:"Tudo",q:"",view:"home",id:null};
const closeNav=()=>{if(innerWidth<=800)nav.classList.add("off")};
const pub=(p,o)=>p?sb.storage.from("videos").getPublicUrl(p,o).data.publicUrl:"";
const nm=v=>(v.profiles&&v.profiles.name)||"Canal";
const cn=x=>Array.isArray(x)&&x[0]?x[0].count:0;
const myName=()=>(ME&&ME.user_metadata&&ME.user_metadata.name)||(ME&&ME.email)||"?";
const ok=async p=>{const{error}=await p;if(error)throw error};
const VSEL="id,title,description,category,duration,video_path,thumb_path,allow_download,created_at,views,user_id,profiles(name),likes(count),comments(count)";
const loading=()=>{main.innerHTML=`<div class="empty">Carregando…</div>`};
const fail=e=>{main.innerHTML=`<div class="empty">${esc((e&&e.message)||"Erro ao carregar.")}<br><button class="btn pri" data-a="home">Voltar ao início</button></div>`};
const th=v=>`<div class="th" style="--h:${hue(v.id)}">${v.thumb_path?`<img src="${pub(v.thumb_path)}" alt="" loading="lazy">`:"<span>▶</span>"}<i>${dur(v.duration)}</i></div>`;
const card=(v,r)=>`<a class="${r?"rel":"card"}" data-a="watch" data-v="${v.id}">${th(v)}<div class="meta">${r?"":`<div class="av" style="--h:${hue(v.user_id)}">${esc(nm(v)[0])}</div>`}<div><h3>${esc(v.title)}</h3><p>${esc(nm(v))}</p><p>${fm(v.views)} visualizações · ${ago(v.created_at)}</p></div></div></a>`;
const cmH=c=>`<div class="cm"><div class="av" style="--h:${hue(c.user_id)}">${esc(nm(c)[0])}</div><div><b>${esc(nm(c))}</b> <small>${ago(c.created_at)}</small>${ME&&(c.user_id===ME.id||ADMIN)?`<button data-a="dc" data-v="${c.id}">Excluir</button>`:""}<p>${esc(c.text)}</p></div></div>`;
const grid=r=>r.length?`<div class="grid">${r.map(v=>card(v)).join("")}</div>`:null;

function drawNav(){
 const h=S.view==="home",it=[["home","🏠","Início"],["trend","🔥","Em alta"],["subs","📺","Inscrições"],["upload","⬆️","Enviar vídeo"]];if(ME)it.push(["mine","👤","Meu canal"]);
 nav.innerHTML=it.map(([k,i,l])=>`<button data-a="nav" data-v="${k}" class="${h&&S.nav===k&&S.cat==="Tudo"?"on":""}"><span>${i}</span>${l}</button>`).join("")+`<h4>Explorar</h4>`+CATS.map(c=>`<button data-a="cat" data-v="${c}" class="${h&&S.cat===c?"on":""}">${c}</button>`).join("");
}
function drawUser(){$("#u").innerHTML=ME?`<button class="btn pri" data-a="nav" data-v="upload">＋ Enviar</button><button class="me" data-a="nav" data-v="mine" title="Meu canal" style="--h:${hue(ME.id)}">${esc(myName()[0].toUpperCase())}</button><button class="btn" data-a="out">Sair</button>`:`<button class="btn pri" data-a="go" data-v="login">Entrar</button>`}
function paint(){if(!W)return;const l=$("#lk");if(l){l.className="btn"+(W.liked?" on":"");l.textContent="👍 "+fm(W.likes)}
 const s=$("#sub");if(s)s.textContent=W.subbed?"Inscrito ✓":"Inscrever-se";const sc=$("#sc");if(sc)sc.textContent=fm(W.subs)+" inscritos";
 const cl=$("#cl");if(cl&&W.cm){cl.innerHTML=W.cm.map(cmH).join("");$("#cc").textContent=W.cm.length+" comentários"}}
async function loadAdmin(){const{data}=await sb.from("profiles").select("is_admin").eq("id",ME.id).maybeSingle();ADMIN=!!(data&&data.is_admin)}

async function home(){
 const r0=++R;W=null;loading();
 let q=sb.from("videos").select(VSEL).limit(60);
 if(S.nav==="trend")q=q.order("views",{ascending:false});
 q=q.order("created_at",{ascending:false});
 if(S.cat!=="Tudo")q=q.eq("category",S.cat);
 if(S.q)q=q.ilike("title",`%${S.q.replace(/[%_,()]/g," ")}%`);
 if(S.nav==="subs"){if(!ME)return go("login");const{data:s}=await sb.from("subs").select("channel_id").eq("user_id",ME.id);q=q.in("user_id",(s||[]).map(x=>x.channel_id).concat(["00000000-0000-0000-0000-000000000000"]))}
 const{data,error}=await q;if(r0!==R)return;if(error)return fail(error);
 main.innerHTML=`<div class="chips">${["Tudo",...CATS].map(c=>`<button data-a="cat" data-v="${c}" class="${S.cat===c?"on":""}">${c}</button>`).join("")}</div>`+
 (grid(data)||`<div class="empty">${S.nav==="subs"?"Você ainda não se inscreveu em nenhum canal. Abra um vídeo e clique em Inscrever-se.":"Nenhum vídeo por aqui ainda."}<br><button class="btn pri" data-a="nav" data-v="upload">Enviar um vídeo</button></div>`);
}
async function watch(){
 const r0=++R;W=null;loading();
 const{data:v,error}=await sb.from("videos").select(VSEL).eq("id",S.id).maybeSingle();if(r0!==R)return;if(error)return fail(error);if(!v)return fail({message:"Vídeo não encontrado."});
 const[sc,lk,cm,rl,sb2]=await Promise.all([
  sb.from("subs").select("*",{count:"exact",head:true}).eq("channel_id",v.user_id),
  ME?sb.from("likes").select("video_id").eq("video_id",v.id).eq("user_id",ME.id):{data:[]},
  sb.from("comments").select("id,text,created_at,user_id,profiles(name)").eq("video_id",v.id).order("created_at",{ascending:false}).limit(200),
  sb.from("videos").select(VSEL).neq("id",v.id).order("views",{ascending:false}).limit(30),
  ME?sb.from("subs").select("channel_id").eq("channel_id",v.user_id).eq("user_id",ME.id):{data:[]}]);
 if(r0!==R)return;
 W={v,subs:sc.count||0,liked:(lk.data||[]).length>0,likes:cn(v.likes),subbed:(sb2.data||[]).length>0,cm:cm.data||[]};
 const rel=(rl.data||[]).sort((a,b)=>(b.category===v.category)-(a.category===v.category)).slice(0,8),own=ME&&v.user_id===ME.id;
 main.innerHTML=`<div class="watch"><section><video class="player" controls autoplay playsinline src="${pub(v.video_path)}" ${v.thumb_path?`poster="${pub(v.thumb_path)}"`:""}></video>
 <h1>${esc(v.title)}</h1><div class="row"><a class="av" data-a="ch" data-v="${v.user_id}" style="--h:${hue(v.user_id)}">${esc(nm(v)[0])}</a>
 <div class="grow"><b>${esc(nm(v))}</b><small id="sc"></small></div>
 ${own?"":`<button class="btn pri" id="sub" data-a="sub" data-v="${v.user_id}"></button>`}
 <button class="btn" id="lk" data-a="like" data-v="${v.id}"></button>
 ${v.allow_download?`<button class="btn" data-a="dl" data-v="${v.id}">⬇ Baixar</button>`:""}
 <button class="btn" data-a="rep" data-v="${v.id}">Denunciar</button>
 ${own||ADMIN?`<button class="btn" data-a="del" data-v="${v.id}">Excluir</button>`:""}</div>
 <div class="desc"><b>${fm(v.views+1)} visualizações · ${ago(v.created_at)} · ${esc(v.category)}</b><div class="pre">${esc(v.description||"")}</div></div><b id="cc"></b>
 ${ME?`<form class="cf" id="cf" data-v="${v.id}"><input name="t" maxlength="500" placeholder="Adicione um comentário" aria-label="Comentário" required><button class="btn">Comentar</button></form>`:`<p><a data-a="go" data-v="login" style="cursor:pointer"><u>Entre</u></a> para comentar.</p>`}
 <div id="cl"></div></section><aside>${rel.map(x=>card(x,1)).join("")}</aside></div>`;
 paint();sb.rpc("increment_views",{vid:v.id}).then(()=>{});
}
async function channel(){
 const r0=++R;W=null;loading();const u=S.id;
 const[p,vs,sc,sb2]=await Promise.all([sb.from("profiles").select("name").eq("id",u).maybeSingle(),
  sb.from("videos").select(VSEL).eq("user_id",u).order("created_at",{ascending:false}),
  sb.from("subs").select("*",{count:"exact",head:true}).eq("channel_id",u),
  ME?sb.from("subs").select("channel_id").eq("channel_id",u).eq("user_id",ME.id):{data:[]}]);
 if(r0!==R)return;if(!p.data)return fail({message:"Canal não encontrado."});
 const r=vs.data||[];W={subs:sc.count||0,subbed:(sb2.data||[]).length>0};
 main.innerHTML=`<div class="row ch"><div class="av big" style="--h:${hue(u)}">${esc(p.data.name[0])}</div><div class="grow"><h1>${esc(p.data.name)}</h1><small id="sc"></small> <small>· ${r.length} vídeos</small></div>${ME&&ME.id===u?"":`<button class="btn pri" id="sub" data-a="sub" data-v="${u}"></button>`}</div>`+
 (grid(r)||`<div class="empty">Este canal ainda não publicou vídeos.</div>`);paint();
}
const frame=f=>Promise.race([new Promise((ok,no)=>{const u=URL.createObjectURL(f),v=document.createElement("video");v.muted=true;v.preload="metadata";v.src=u;
 v.onerror=()=>{URL.revokeObjectURL(u);no()};v.onloadedmetadata=()=>{v.currentTime=Math.min(1,v.duration/2)||0};
 v.onseeked=()=>{const c=document.createElement("canvas");c.width=640;c.height=360;c.getContext("2d").drawImage(v,0,0,640,360);const d=v.duration;c.toBlob(b=>{URL.revokeObjectURL(u);ok({blob:b,dur:isFinite(d)?d:0})},"image/jpeg",.8)}}),new Promise((_,no)=>setTimeout(no,8000))]);
function upload(){
 R++;W=null;if(!ME)return go("login");
 main.innerHTML=`<form class="box" id="uf"><h1>Enviar vídeo</h1>
 <label>Arquivo (MP4, WebM, MOV ou OGG, até ${MAXMB} MB)<input type="file" name="video" accept="video/mp4,video/webm,video/ogg,video/quicktime" required></label>
 <label>Título<input name="title" maxlength="100" required></label>
 <label>Descrição<textarea name="desc" rows="4" maxlength="2000"></textarea></label>
 <label>Categoria<select name="cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label>
 <label>Miniatura (opcional; sem ela usamos um quadro do vídeo)<input type="file" name="thumb" accept="image/jpeg,image/png,image/webp"></label>
 <label class="ck"><input type="checkbox" name="dl"> Permitir que outras pessoas baixem este vídeo</label>
 <label class="ck"><input type="checkbox" name="rights" required> Declaro que sou o autor ou tenho autorização para publicar este vídeo e que ele não viola direitos autorais.</label>
 <p class="err" id="er"></p><button class="btn pri">Publicar</button></form>`;
 $("#uf").onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector("button.pri"),file=f.video.files[0],er=$("#er"),up=[];er.textContent="";
  if(file.size>MAXMB*1048576){er.textContent=`O arquivo passa do limite de ${MAXMB} MB.`;return}
  b.disabled=true;b.textContent="Enviando… não feche a página";
  try{let m={blob:null,dur:0};try{m=await frame(file)}catch{}
   const ext=(file.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5)||"mp4",base=`${ME.id}/${rid()}`,bk=sb.storage.from("videos");
   let r=await bk.upload(`${base}.${ext}`,file,{contentType:file.type});if(r.error)throw r.error;up.push(`${base}.${ext}`);
   let tp=null;const tb=f.thumb.files[0]||m.blob;
   if(tb){const te=tb.type==="image/png"?"png":tb.type==="image/webp"?"webp":"jpg";r=await bk.upload(`${base}-t.${te}`,tb,{contentType:tb.type||"image/jpeg"});if(!r.error){tp=`${base}-t.${te}`;up.push(tp)}}
   const{data,error}=await sb.from("videos").insert({user_id:ME.id,title:f.title.value.trim().slice(0,100),description:f.desc.value.slice(0,2000),category:f.cat.value,duration:Math.round(m.dur||0),video_path:up[0],thumb_path:tp,allow_download:f.dl.checked}).select("id").single();
   if(error)throw error;go("watch",data.id)}
  catch(x){if(up.length)sb.storage.from("videos").remove(up);er.textContent=x.message||"Falha no envio.";b.disabled=false;b.textContent="Publicar"}};
}
function login(m="in"){
 R++;W=null;const i=m==="in";
 main.innerHTML=`<form class="box" id="lf"><h1>${i?"Entrar":"Criar conta"}</h1>${i?"":`<label>Nome do canal<input name="name" required maxlength="40"></label>`}
 <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
 <label>Senha<input type="password" name="password" minlength="8" required autocomplete="${i?"current-password":"new-password"}"></label>
 <p class="err" id="er"></p><button class="btn pri">${i?"Entrar":"Criar conta"}</button>
 <a href="#" data-a="mode" data-v="${i?"up":"in"}"><u>${i?"Não tem conta? Criar agora":"Já tem conta? Entrar"}</u></a></form>`;
 $("#lf").onsubmit=async e=>{e.preventDefault();const f=e.target,er=$("#er");er.textContent="";const email=f.email.value.trim(),password=f.password.value;
  const r=i?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{data:{name:f.name.value.trim()}}});
  if(r.error){er.textContent=r.error.message==="Invalid login credentials"?"E-mail ou senha incorretos.":r.error.message;return}
  if(!r.data.session){er.style.color="inherit";er.textContent="Conta criada! Confirme o e-mail que enviamos e depois entre.";return}
  ME=r.data.user;await loadAdmin();drawUser();go("home")};
}
function render(){drawNav();({watch,channel,upload,login}[S.view]||home)()}
function go(v,id){S.view=v;S.id=id||null;render();window.scrollTo(0,0)}

document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v;
 try{
  if(a==="menu")nav.classList.toggle("off");
  else if(a==="theme"){const d=document.documentElement;d.dataset.theme=getComputedStyle(d).colorScheme==="dark"?"light":"dark"}
  else if(a==="home"){S.nav="home";S.cat="Tudo";S.q="";$("#q").value="";go("home")}
  else if(a==="cat"){S.cat=v;S.nav="home";closeNav();go("home")}
  else if(a==="nav"){closeNav();if(v==="upload")go("upload");else if(v==="mine")go("channel",ME.id);else{S.nav=v;S.cat="Tudo";S.q="";$("#q").value="";go("home")}}
  else if(a==="go"){e.preventDefault();go(v)}
  else if(a==="mode"){e.preventDefault();login(v)}
  else if(a==="watch")go("watch",v);
  else if(a==="ch")go("channel",v);
  else if(a==="out"){await sb.auth.signOut();ME=null;ADMIN=false;drawUser();go("home")}
  else if(a==="like"){if(!ME)return go("login");if(W.liked)await ok(sb.from("likes").delete().eq("video_id",v).eq("user_id",ME.id));else await ok(sb.from("likes").insert({video_id:v,user_id:ME.id}));W.liked=!W.liked;W.likes+=W.liked?1:-1;paint()}
  else if(a==="sub"){if(!ME)return go("login");if(W.subbed)await ok(sb.from("subs").delete().eq("channel_id",v).eq("user_id",ME.id));else await ok(sb.from("subs").insert({channel_id:v,user_id:ME.id}));W.subbed=!W.subbed;W.subs+=W.subbed?1:-1;paint()}
  else if(a==="dl"){const x=W.v,ext=x.video_path.split(".").pop(),n=(x.title.replace(/[^\w\- ]+/g,"").trim().slice(0,60)||"video")+"."+ext,l=document.createElement("a");l.href=pub(x.video_path,{download:n});l.click()}
  else if(a==="rep"){if(!ME)return go("login");const r=prompt("Qual o problema com este vídeo? (direitos autorais, conteúdo impróprio...)");if(r!==null){await ok(sb.from("reports").insert({video_id:v,user_id:ME.id,reason:r.slice(0,500)}));alert("Denúncia enviada. Obrigado.")}}
  else if(a==="del"&&confirm("Excluir este vídeo definitivamente?")){const x=W.v;await ok(sb.from("videos").delete().eq("id",v));await sb.storage.from("videos").remove([x.video_path,x.thumb_path].filter(Boolean));go("home")}
  else if(a==="dc"){await ok(sb.from("comments").delete().eq("id",v));W.cm=W.cm.filter(c=>c.id!==v);paint()}
 }catch(x){alert((x&&x.message)||"Não foi possível concluir a ação.")}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".logo")){e.preventDefault();e.target.click()}});
document.addEventListener("submit",async e=>{
 if(e.target.id==="sf"){e.preventDefault();S.q=$("#q").value.trim();S.cat="Tudo";S.nav="home";go("home")}
 if(e.target.id==="cf"){e.preventDefault();const i=e.target.t,txt=i.value.trim();if(!txt)return;
  try{const{data,error}=await sb.from("comments").insert({video_id:e.target.dataset.v,user_id:ME.id,text:txt}).select("id,text,created_at,user_id").single();if(error)throw error;
   data.profiles={name:myName()};W.cm.unshift(data);i.value="";paint()}catch(x){alert((x&&x.message)||"Não foi possível comentar.")}}
});
(async()=>{
 closeNav();drawNav();
 if(!window.supabase||!C.url||C.url.includes("SEU-PROJETO")){main.innerHTML=`<div class="box"><h1>Falta configurar</h1><p>Abra o arquivo <b>config.js</b> e cole a URL e a chave do seu projeto Supabase (Project Settings &gt; API). Depois recarregue esta página. O passo a passo está no README.</p></div>`;return}
 sb=supabase.createClient(C.url,C.key);
 const{data}=await sb.auth.getSession();ME=data.session?data.session.user:null;if(ME)await loadAdmin();
 sb.auth.onAuthStateChange((ev,s)=>{const n=s?s.user:null;if((n&&n.id)!==(ME&&ME.id)){ME=n;if(!n)ADMIN=false;drawUser();drawNav()}});
 drawUser();go("home");
})();
</script>
