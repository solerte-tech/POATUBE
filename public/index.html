<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POATUBE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4ef0'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--s:#f2f2f4;--s2:#e6e6ea;--tx:#111118;--mu:#626270;--ac:#5b4ef0;--acx:#fff;--bd:#d9d9e0;--er:#c0262d;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151b;--s:#22222b;--s2:#2e2e39;--tx:#f1f1f5;--mu:#a2a2b2;--ac:#8c82ff;--acx:#14141c;--bd:#33333f;--er:#ff7b80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15151b;--s:#22222b;--s2:#2e2e39;--tx:#f1f1f5;--mu:#a2a2b2;--ac:#8c82ff;--acx:#14141c;--bd:#33333f;--er:#ff7b80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg);height:56px}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:20px;letter-spacing:-.04em}
.logo b{display:grid;place-items:center;width:30px;height:22px;border-radius:7px;background:var(--ac);color:var(--acx);font-size:11px}
.search{flex:1;max-width:560px;margin:0 auto;display:flex}
.search input{flex:1;min-width:0;padding:8px 16px;border:1px solid var(--bd);border-radius:20px 0 0 20px;background:var(--bg)}
.search button{padding:0 18px;border:1px solid var(--bd);border-left:0;border-radius:0 20px 20px 0;background:var(--s)}
#u{display:flex;align-items:center;gap:8px}
.me,.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:hsl(var(--h,250) 55% 40%)}
.me{--h:250;width:32px;height:32px}
.av.big{width:80px;height:80px;font-size:32px}
main{padding:0 20px 48px;max-width:1700px;margin:0 auto}
.chips{display:flex;gap:10px;overflow-x:auto;padding:8px 0 16px;position:sticky;top:56px;background:var(--bg);z-index:5}
.chips button{flex:none;padding:6px 14px;border-radius:8px;background:var(--s);white-space:nowrap}
.chips button.on{background:var(--tx);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px 16px}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:40px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 48%),hsl(calc(var(--h) + 50) 70% 24%))}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th i{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-style:normal;font-size:12px;padding:1px 5px;border-radius:4px}
.meta{display:flex;gap:10px;margin-top:10px}
.meta h3,.rel h3{margin:0;font-size:15px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta p{margin:2px 0 0;color:var(--mu);font-size:13px}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding-top:8px}
.player{width:100%;aspect-ratio:16/9;border-radius:14px;background:#000;display:block}
h1{font-size:20px;line-height:1.3;margin:12px 0 8px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:140px}
.grow b{display:block}.grow small{color:var(--mu)}
.btn{display:inline-block;padding:8px 16px;border-radius:20px;background:var(--s);font-weight:600}
.btn:hover{background:var(--s2)}
.btn.pri{background:var(--tx);color:var(--bg)}
.btn.on{background:var(--ac);color:var(--acx)}
.btn:disabled{opacity:.6;cursor:wait}
.desc{margin:14px 0;padding:12px;border-radius:12px;background:var(--s);font-size:14px}
.pre{white-space:pre-wrap;margin-top:6px;overflow-wrap:anywhere}
.cm{display:flex;gap:12px;margin:14px 0}
.cm p{margin:2px 0 0;overflow-wrap:anywhere}
.cm small{color:var(--mu)}
.cm button{color:var(--mu);font-size:12px;margin-left:8px}
.cf{display:flex;gap:10px;margin:16px 0}
.cf input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--bd);background:none;padding:6px 0}
.rel{display:flex;gap:10px;margin-bottom:12px}
.rel .th{width:168px;flex:none;font-size:28px;border-radius:8px}
.rel p{margin:2px 0 0;font-size:12px;color:var(--mu)}
.empty{padding:60px 0;text-align:center;color:var(--mu)}
.empty .btn{margin-top:14px}
.box{max-width:520px;margin:24px auto;display:flex;flex-direction:column;gap:14px}
.box label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.box label.ck{flex-direction:row;gap:10px;font-weight:400;align-items:flex-start}
.box input:not([type=checkbox]),.box select,.box textarea{padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-weight:400}
.box progress{width:100%}
.err{color:var(--er);margin:0;min-height:1em}
.ch{margin:16px 0 24px}
@media (max-width:1000px){.watch{grid-template-columns:1fr}}
@media (max-width:640px){main{padding:0 12px 40px}.rel .th{width:140px}.search{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/"><b>▶</b>POATUBE</a>
  <form class="search" id="sf" role="search"><input id="q" type="search" placeholder="Pesquisar" aria-label="Pesquisar"><button aria-label="Buscar">🔍</button></form>
  <div id="u"></div>
  <button class="btn" data-a="theme" aria-label="Alternar tema">◐</button>
</header>
<main id="main"></main>
<script>
const CATS=["Música","Jogos","Tecnologia","Culinária","Viagens","Esportes","Ciência","Educação","Outros"];
let ME=null,MAX=500,W=null;const st={cat:"Tudo",q:""};
const $=s=>document.querySelector(s),main=$("#main");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(u,o={})=>{const r=await fetch(u,{credentials:"same-origin",...o});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Erro "+r.status);return j};
const post=(u,b)=>api(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
const go=h=>location.hash===h?route():(location.hash=h);
const fm=n=>n>=1e6?(n/1e6).toFixed(1).replace(".",",")+" mi":n>=1e3?Math.round(n/1e3)+" mil":String(n);
const dur=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0")};
const rtf=new Intl.RelativeTimeFormat("pt-BR",{numeric:"auto"});
const ago=t=>{const d=(t-Date.now())/1e3;for(const[u,s]of[["year",31536e3],["month",2592e3],["day",86400],["hour",3600],["minute",60]])if(Math.abs(d)>=s)return rtf.format(Math.round(d/s),u);return"agora"};
const hue=id=>parseInt(id.slice(0,4),16)%360;
const th=v=>`<div class="th" style="--h:${hue(v.id)}">${v.thumb?`<img src="${v.thumb}" alt="" loading="lazy">`:"<span>▶</span>"}<i>${dur(v.dur)}</i></div>`;
const card=(v,r)=>`<a class="${r?"rel":"card"}" href="#/watch/${v.id}">${th(v)}<div class="meta">${r?"":`<div class="av" style="--h:${hue(v.uid)}">${esc(v.channel[0])}</div>`}<div><h3>${esc(v.title)}</h3><p>${esc(v.channel)}</p><p>${fm(v.views)} visualizações · ${ago(v.created)}</p></div></div></a>`;
const cmH=c=>`<div class="cm" id="c${c.id}"><div class="av" style="--h:${hue(c.id)}">${esc(c.name[0])}</div><div><b>${esc(c.name)}</b> <small>${ago(c.t)}</small>${c.mine?`<button data-a="dc" data-v="${c.id}">Excluir</button>`:""}<p>${esc(c.text)}</p></div></div>`;

function drawUser(){$("#u").innerHTML=ME?`<a class="btn pri" href="#/upload">＋ Enviar</a><a class="me" href="#/channel/${ME.id}" title="Meu canal">${esc(ME.name[0])}</a><button class="btn" data-a="out">Sair</button>`:`<a class="btn pri" href="#/login">Entrar</a>`}
function paint(){if(!W)return;const s=$("#sub");if(s)s.textContent=W.subbed?"Inscrito ✓":"Inscrever-se";const sc=$("#sc");if(sc)sc.textContent=fm(W.subs)+" inscritos";const l=$("#lk");if(l){l.className="btn"+(W.liked?" on":"");l.textContent="👍 "+fm(W.likes)}}

async function home(){
 const tabs=["Tudo","Em alta","Inscrições",...CATS],p=new URLSearchParams();W=null;
 if(st.q)p.set("q",st.q);
 if(st.cat==="Em alta")p.set("sort","views");else if(st.cat==="Inscrições")p.set("subs","1");else if(st.cat!=="Tudo")p.set("cat",st.cat);
 let r;try{r=await api("/api/videos?"+p)}catch(e){if(st.cat==="Inscrições"){st.cat="Tudo";return go("#/login")}throw e}
 main.innerHTML=`<div class="chips">${tabs.map(c=>`<button data-a="cat" data-v="${c}" class="${st.cat===c?"on":""}">${c}</button>`).join("")}</div>`+
 (r.length?`<div class="grid">${r.map(v=>card(v)).join("")}</div>`:`<div class="empty">Nenhum vídeo por aqui ainda.<br><a class="btn pri" href="#/upload">Enviar um vídeo</a></div>`);
}
async function watch(id){
 const v=await api("/api/videos/"+id);W=v;
 main.innerHTML=`<div class="watch"><section><video class="player" controls autoplay playsinline src="${v.url}" ${v.thumb?`poster="${v.thumb}"`:""}></video>
 <h1>${esc(v.title)}</h1><div class="row"><a class="av" href="#/channel/${v.uid}" style="--h:${hue(v.uid)}">${esc(v.channel[0])}</a>
 <div class="grow"><b>${esc(v.channel)}</b><small id="sc"></small></div>
 ${v.uid!==ME?.id?`<button class="btn pri" id="sub" data-a="sub" data-v="${v.uid}"></button>`:""}
 <button class="btn" id="lk" data-a="like" data-v="${v.id}"></button>
 ${v.canDownload?`<a class="btn" href="/api/videos/${v.id}/download">⬇ Baixar</a>`:""}
 <button class="btn" data-a="rep" data-v="${v.id}">Denunciar</button>
 ${v.mine?`<button class="btn" data-a="del" data-v="${v.id}">Excluir</button>`:""}</div>
 <div class="desc"><b>${fm(v.views)} visualizações · ${ago(v.created)} · ${esc(v.cat)}</b><div class="pre">${esc(v.desc)}</div></div>
 <b id="cc"></b>
 ${ME?`<form class="cf" id="cf" data-v="${v.id}"><input name="t" maxlength="500" placeholder="Adicione um comentário" aria-label="Comentário" required><button class="btn">Comentar</button></form>`:`<p><a href="#/login"><u>Entre</u></a> para comentar.</p>`}
 <div id="cl">${v.comments.map(cmH).join("")}</div></section><aside>${v.related.map(x=>card(x,1)).join("")}</aside></div>`;
 count();paint();
}
const count=()=>{const e=$("#cc");if(e)e.textContent=document.querySelectorAll("#cl .cm").length+" comentários"};
async function channel(id){
 const[c,r]=await Promise.all([api("/api/channels/"+id),api("/api/videos?channel="+id)]);
 main.innerHTML=`<div class="row ch"><div class="av big" style="--h:${hue(id)}">${esc(c.name[0])}</div><div class="grow"><h1>${esc(c.name)}</h1><small id="sc"></small> <small>· ${r.length} vídeos</small></div>${ME?.id!==id?`<button class="btn pri" id="sub" data-a="sub" data-v="${id}"></button>`:""}</div>`+
 (r.length?`<div class="grid">${r.map(v=>card(v)).join("")}</div>`:`<div class="empty">Este canal ainda não publicou vídeos.</div>`);
 W={subbed:c.subbed,subs:c.subs};paint();
}
const frame=f=>Promise.race([new Promise((ok,no)=>{const u=URL.createObjectURL(f),v=document.createElement("video");v.muted=true;v.preload="metadata";v.src=u;
 v.onerror=()=>{URL.revokeObjectURL(u);no()};v.onloadedmetadata=()=>{v.currentTime=Math.min(1,v.duration/2)||0};
 v.onseeked=()=>{const c=document.createElement("canvas");c.width=640;c.height=360;c.getContext("2d").drawImage(v,0,0,640,360);const d=v.duration;c.toBlob(b=>{URL.revokeObjectURL(u);ok({blob:b,dur:isFinite(d)?d:0})},"image/jpeg",.8)}}),new Promise((_,no)=>setTimeout(no,8000))]);
function upload(){
 if(!ME)return go("#/login");W=null;
 main.innerHTML=`<form class="box" id="uf"><h1>Enviar vídeo</h1>
 <label>Arquivo (MP4, WebM, OGG ou MOV, até ${MAX} MB)<input type="file" name="video" accept="video/mp4,video/webm,video/ogg,video/quicktime" required></label>
 <label>Título<input name="title" maxlength="100" required></label>
 <label>Descrição<textarea name="desc" rows="4" maxlength="2000"></textarea></label>
 <label>Categoria<select name="cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label>
 <label>Miniatura (opcional; sem ela usamos um quadro do vídeo)<input type="file" name="thumb" accept="image/jpeg,image/png,image/webp"></label>
 <label class="ck"><input type="checkbox" name="dl" value="1"> Permitir que outras pessoas baixem este vídeo</label>
 <label class="ck"><input type="checkbox" name="rights" value="1" required> Declaro que sou o autor ou tenho autorização para publicar este vídeo e que ele não viola direitos autorais.</label>
 <progress id="pr" max="100" value="0" hidden></progress><p class="err" id="er"></p><button class="btn pri">Publicar</button></form>`;
 $("#uf").onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector("button.pri");b.disabled=true;$("#er").textContent="";
  try{const fd=new FormData(f);let m={blob:null,dur:0};try{m=await frame(f.video.files[0])}catch{}
   fd.set("dur",m.dur);if(!f.thumb.files[0]){fd.delete("thumb");if(m.blob)fd.set("thumb",m.blob,"t.jpg")}
   const v=await new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open("POST","/api/videos");
    x.upload.onprogress=p=>{$("#pr").hidden=false;$("#pr").value=p.loaded/p.total*100};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch{}x.status<300?ok(j):no(new Error(j.error||"Falha no envio."))};
    x.onerror=()=>no(new Error("Sem conexão com o servidor."));x.send(fd)});
   go("#/watch/"+v.id)}catch(x){$("#er").textContent=x.message;b.disabled=false}};
}
function login(m="in"){
 W=null;const i=m==="in";
 main.innerHTML=`<form class="box" id="lf"><h1>${i?"Entrar":"Criar conta"}</h1>${i?"":`<label>Nome do canal<input name="name" required maxlength="40"></label>`}
 <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
 <label>Senha<input type="password" name="password" minlength="8" required autocomplete="${i?"current-password":"new-password"}"></label>
 <p class="err" id="er"></p><button class="btn pri">${i?"Entrar":"Criar conta"}</button>
 <a href="#" data-a="mode" data-v="${i?"up":"in"}"><u>${i?"Não tem conta? Criar agora":"Já tem conta? Entrar"}</u></a></form>`;
 $("#lf").onsubmit=async e=>{e.preventDefault();try{ME=await post(i?"/api/login":"/api/register",Object.fromEntries(new FormData(e.target)));drawUser();go("#/")}catch(x){$("#er").textContent=x.message}};
}
async function route(){
 const[h,a]=location.hash.slice(2).split("/");
 try{if(h==="watch")await watch(a);else if(h==="channel")await channel(a);else if(h==="upload")upload();else if(h==="login")login();else await home()}
 catch(e){main.innerHTML=`<div class="empty">${esc(e.message)}<br><a class="btn pri" href="#/">Voltar ao início</a></div>`}
 window.scrollTo(0,0);
}
addEventListener("hashchange",route);
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v;
 try{
  if(a==="cat"){st.cat=v;go("#/")}
  else if(a==="theme"){const d=document.documentElement;d.dataset.theme=getComputedStyle(d).colorScheme==="dark"?"light":"dark"}
  else if(a==="mode"){e.preventDefault();login(v)}
  else if(a==="out"){await post("/api/logout");ME=null;drawUser();go("#/")}
  else if((a==="like"||a==="sub")&&!ME)go("#/login");
  else if(a==="like"){const r=await post(`/api/videos/${v}/like`);W.liked=r.liked;W.likes=r.likes;paint()}
  else if(a==="sub"){const r=await post(`/api/channels/${v}/sub`);W.subbed=r.subbed;W.subs=r.subs;paint()}
  else if(a==="del"&&confirm("Excluir este vídeo definitivamente?")){await api("/api/videos/"+v,{method:"DELETE"});go("#/")}
  else if(a==="dc"){await api("/api/comments/"+v,{method:"DELETE"});$("#c"+v).remove();count()}
  else if(a==="rep"){if(!ME)return go("#/login");const r=prompt("Qual o problema com este vídeo? (direitos autorais, conteúdo impróprio...)");if(r!==null){await post(`/api/videos/${v}/report`,{reason:r});alert("Denúncia enviada. Obrigado.")}}
 }catch(x){alert(x.message)}
});
document.addEventListener("submit",async e=>{
 if(e.target.id==="sf"){e.preventDefault();st.q=$("#q").value.trim();st.cat="Tudo";go("#/")}
 if(e.target.id==="cf"){e.preventDefault();const i=e.target.t;try{const c=await post(`/api/videos/${e.target.dataset.v}/comments`,{t:i.value});$("#cl").insertAdjacentHTML("afterbegin",cmH(c));i.value="";count()}catch(x){alert(x.message)}}
});
api("/api/me").then(r=>{ME=r.user;MAX=r.maxMB}).catch(()=>{}).finally(()=>{drawUser();route()});
</script>
</body>
</html>
